<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="./style/style.css" />
</head>
<body>
  <div class="container">
    <h1>Personal Expense Tracker</h1>
    <h3> Remember </h3>
    <h2>"Track Smart. Spend Wise. Live Free."</h2>

    <div class="totals">
      <div class="balance">Balance: <span id="balance">$0.00</span></div>
      <div class="income">Income: <span id="income">$0.00</span></div>
      <div class="expense">Expense: <span id="expense">-$0.00</span></div>
    </div>

    <form id="transaction-form">
      <input type="text" id="description" placeholder="Purpose" required />
      <input type="number" id="amount" placeholder="Amount (positive for income, negative for expense)" required />
      <button type="submit">Add Transaction</button>
    </form>

    <div class="filters">
      <ul class="filter-list">
        <li><button class="filter active" data-filter="all">All</button></li>
        <li><button class="filter" data-filter="income">Income</button></li>
        <li><button class="filter" data-filter="expense">Expense</button></li>
      </ul>
    </div>

    <ul id="transaction-list" class="transactions"></ul>

    <div class="chart-container">
      <canvas id="expenseChart"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./script/script.js"></script>
</body>
</html>
